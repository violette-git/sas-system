function PriorityBadge({ priority }) {
  const colors = {
    P0: { bg: "#EF444420", text: "#EF4444", label: "Must Have" },
    P1: { bg: "#F59E0B20", text: "#F59E0B", label: "Should Have" },
    P2: { bg: "#6366F120", text: "#6366F1", label: "Nice to Have" },
  };
  const c = colors[priority];
  return <span style={{ fontSize:11, padding:"2px 8px", borderRadius:999, backgroundColor:c.bg, color:c.text, fontWeight:600, whiteSpace:"nowrap" }}>{priority} {c.label}</span>;
}

function FlowNode({ label, color, x, y, w=140, h=36, onClick, active }) {
  return (
    <g onClick={onClick} style={{ cursor: onClick ? "pointer" : "default" }}>
      <rect x={x} y={y} width={w} height={h} rx={8} fill={active ? color : color+"30"} stroke={color} strokeWidth={active ? 2 : 1} />
      <text x={x+w/2} y={y+h/2+1} textAnchor="middle" dominantBaseline="middle" fill={active ? "#fff" : COLORS.text} fontSize={11} fontWeight={500} fontFamily="Inter, system-ui, sans-serif">{label}</text>
    </g>
  );
}

function Arrow({ x1, y1, x2, y2, color="#4B5563" }) {
  return <line x1={x1} y1={y1} x2={x2} y2={y2} stroke={color} strokeWidth={1.5} markerEnd="url(#arrow)" />;
}

        </div>
        {DB_TABLES.map((t,i)=>(
          <div key={i} style={{ display:"grid", gridTemplateColumns:"1fr 2fr 100px", padding:"12px 20px", borderBottom:i<DB_TABLES.length-1?`1px solid ${COLORS.border}20`:"none", fontSize:13 }}>
            <span style={{ fontWeight:600, fontFamily:"monospace", color:t.exists?COLORS.green:COLORS.textMuted }}>{t.name}</span>
            <span style={{ color:COLORS.textMuted }}>{t.desc}</span>
            <span style={{ fontSize:11, padding:"2px 10px", borderRadius:999, backgroundColor:t.exists?COLORS.green+"20":COLORS.amber+"20", color:t.exists?COLORS.green:COLORS.amber, fontWeight:600, textAlign:"center" }}>{t.exists?"Built":"Planned"}</span>
          </div>
        ))}
      </div>}
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
</html>
